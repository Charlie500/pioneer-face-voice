<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#03060a">
  <title>人脸语音对话 · Pioneer Face</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1 class="visually-hidden">人脸语音对话</h1>
    <div id="face-stage" role="img" aria-label="全屏粒子人脸动画"></div>
    <button id="controls-button" class="control-trigger glass" type="button" popovertarget="control-panel" aria-controls="control-panel" aria-expanded="false" aria-label="打开控制中心" title="控制中心">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h8m4 0h4M4 17h3m4 0h9"/><circle cx="14" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      <span class="state-light" aria-hidden="true"></span>
    </button>

    <section id="control-panel" class="control-panel glass" popover="auto" role="dialog" aria-label="控制中心">
      <div class="panel-heading">
        <h2>控制中心</h2>
        <p id="connection-status">尚未连接</p>
      </div>
      <div class="segmented" role="tablist" aria-label="控制面板">
        <button id="tab-chat" type="button" role="tab" data-tab="chat" aria-selected="true" aria-controls="panel-chat">对话</button>
        <button id="settings-button" type="button" role="tab" data-tab="model" aria-selected="false" aria-controls="settings" tabindex="-1">模型</button>
        <button id="tab-voice" type="button" role="tab" data-tab="voice" aria-selected="false" aria-controls="panel-voice" tabindex="-1">声音</button>
        <button id="tab-appearance" type="button" role="tab" data-tab="appearance" aria-selected="false" aria-controls="panel-appearance" tabindex="-1">外观</button>
      </div>

      <section id="panel-chat" class="tab-content" role="tabpanel" aria-labelledby="tab-chat">
        <div class="conversation" aria-label="对话内容">
          <p id="last-user" class="last-user"></p>
          <p id="reply" aria-live="polite">从一句话开始。</p>
        </div>
        <p id="activity" role="status">正在载入人脸</p>
        <div class="voice-controls">
          <button id="mic-button" class="primary" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 11v1a6 6 0 0 0 12 0v-1M12 18v3m-3 0h6"/></svg>
            <span id="mic-label">开始说话</span>
          </button>
          <button id="stop-button" type="button" disabled>停止回应</button>
        </div>
        <form id="message-form" class="message-form">
          <label class="visually-hidden" for="message">文字输入</label>
          <input id="message" autocomplete="off" placeholder="输入一句话…" maxlength="8000">
          <button type="submit" id="send-button" class="send-button" aria-label="发送"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
        </form>
        <div class="chat-options">
          <button id="preview-button" class="quiet-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4m4-8v12m4-15v18m4-15v12m4-8v4"/></svg>原站语音预览</button>
          <label class="switch-label">语音回应 <input id="voice-output" class="switch" type="checkbox" checked></label>
        </div>
      </section>

      <section id="settings" class="tab-content" role="tabpanel" aria-labelledby="settings-button" hidden>
        <form id="settings-form" class="settings-form">
          <label>对话接口 <select id="provider"><option value="ollama">Ollama</option><option value="compatible">兼容 API · LM Studio</option></select></label>
          <label>服务地址 <input id="model-url" type="url" required placeholder="http://127.0.0.1:11434"></label>
          <label>模型名称 <input id="model-name" list="model-names" placeholder="选择或填写模型名"><datalist id="model-names"></datalist></label>
          <button id="load-models" class="quiet-button" type="button">读取已安装模型 <span aria-hidden="true">↗</span></button>
          <div class="field-divider"></div>
          <label>语音识别 <select id="recognition-mode"><option value="bundled">内置离线识别</option><option value="local">外部识别服务</option><option value="browser">浏览器识别</option></select></label>
          <p id="recognition-note" class="note">自带模型在本机识别，不需要额外 Key。</p>
          <div id="bundled-speech-options">
            <label>内置识别模型 <select id="speech-model"><option value="base">Whisper Base · 均衡</option><option value="tiny">Whisper Tiny · 轻量</option></select></label>
            <p id="hardware-note" class="note">正在检查本机配置…</p>
            <button id="check-hardware" class="quiet-button" type="button">重新检查本机</button>
            <button id="test-speech" class="quiet-button" type="button">用中文示例检查识别</button>
            <p id="speech-check-status" class="note" role="status"></p>
            <button id="try-speech-chat" class="quiet-button" type="button" hidden>用识别结果试聊</button>
          </div>
          <label>识别语言 <select id="speech-language"><option value="chinese">中文</option><option value="english">英语</option><option value="auto">自动识别语言</option></select></label>
          <details class="advanced">
            <summary>授权与识别服务</summary>
            <div class="advanced-fields">
              <label>对话授权环境变量名 <input id="model-key-env" placeholder="MODEL_API_KEY"></label>
              <label>识别服务地址 <input id="stt-url" type="url" placeholder="支持 /v1/audio/transcriptions"></label>
              <label>识别模型名称 <input id="stt-model" placeholder="语音识别模型名"></label>
              <label>识别授权环境变量名 <input id="stt-key-env" placeholder="STT_API_KEY"></label>
              <p class="note">授权只填写环境变量名称，密钥由服务端环境提供。</p>
            </div>
          </details>
          <p id="settings-status" role="status"></p>
          <button type="submit" class="primary">保存配置</button>
        </form>
      </section>

      <section id="panel-voice" class="tab-content" role="tabpanel" aria-labelledby="tab-voice" hidden>
        <div class="appearance-heading"><h3>选择你的声音</h3><p>先听一听，再找到适合的语气。</p></div>
        <div class="voice-settings">
          <label for="voice-select">回应音色</label>
          <select id="voice-select" aria-describedby="voice-list-note"><option value="">自动选择中文声音</option></select>
          <p id="voice-list-note" class="note">正在读取可用声音…</p>
          <label class="slider-label" for="voice-rate">语速 <output id="voice-rate-value" for="voice-rate">1.00×</output></label>
          <input id="voice-rate" type="range" min="0.7" max="1.3" step="0.05" value="1">
          <label class="slider-label" for="voice-pitch">音高 <output id="voice-pitch-value" for="voice-pitch">1.00</output></label>
          <input id="voice-pitch" type="range" min="0.8" max="1.2" step="0.05" value="1">
          <div class="voice-controls">
            <button id="audition-voice" class="primary" type="button">试听这个声音</button>
            <button id="stop-audition" type="button" disabled>停止试听</button>
          </div>
          <p id="voice-audition-status" class="note" role="status"></p>
          <button id="reset-voice" class="quiet-button" type="button">恢复默认声音</button>
          <p class="note">选择自动保存，用于后续聊天回应。可用音色由这台电脑和浏览器提供。</p>
        </div>
      </section>

      <section id="panel-appearance" class="tab-content appearance-panel" role="tabpanel" aria-labelledby="tab-appearance" hidden>
        <div class="appearance-heading"><h3>光的颜色</h3><p>让人脸成为唯一的主视觉。</p></div>
        <select id="theme" hidden aria-label="人脸颜色">
          <option value="frost" selected>冰白</option><option value="amethyst">紫晶</option><option value="sapphire">蓝宝石</option><option value="emerald">翡翠</option><option value="ruby">红宝石</option><option value="amber">琥珀</option><option value="gold">金色</option>
        </select>
        <div class="theme-grid" role="group" aria-label="人脸颜色">
          <button type="button" class="theme-chip" data-theme="frost" aria-pressed="true"><span style="--swatch:#d4eefb"></span>冰白</button>
          <button type="button" class="theme-chip" data-theme="amethyst" aria-pressed="false"><span style="--swatch:#a986ff"></span>紫晶</button>
          <button type="button" class="theme-chip" data-theme="sapphire" aria-pressed="false"><span style="--swatch:#65b9f5"></span>蓝宝石</button>
          <button type="button" class="theme-chip" data-theme="emerald" aria-pressed="false"><span style="--swatch:#6ce5c0"></span>翡翠</button>
          <button type="button" class="theme-chip" data-theme="ruby" aria-pressed="false"><span style="--swatch:#f57e99"></span>红宝石</button>
          <button type="button" class="theme-chip" data-theme="amber" aria-pressed="false"><span style="--swatch:#f3b27c"></span>琥珀</button>
          <button type="button" class="theme-chip" data-theme="gold" aria-pressed="false"><span style="--swatch:#e4ca85"></span>金色</button>
        </div>
        <p class="note">人脸会随窗口大小自动贴合。设置收起后，画面只留下人脸。</p>
      </section>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
